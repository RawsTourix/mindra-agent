name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-c0:
    name: FULL-C0 (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить uv и Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.14"
          enable-cache: true

      - name: Установить locked environment
        run: uv sync --locked

      - name: Проверить lint
        run: uv run --locked ruff check .

      - name: Проверить форматирование
        run: uv run --locked ruff format --check .

      - name: Проверить типы
        run: uv run --locked mypy src tests

      - name: Проверить import contracts
        env:
          PYTHONUTF8: "1"
        run: uv run --locked lint-imports

      - name: Запустить тесты
        run: uv run --locked pytest

      - name: Собрать wheel и sdist
        run: uv build
