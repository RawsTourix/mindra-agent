[project]
name = "mindra-agent"
version = "0.1.0"
description = "Исследовательская модульная когнитивная архитектура MINDRA"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
mindra = "mindra.entrypoints:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis",
    "import-linter",
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv]
required-version = ">=0.12.2,<0.13"

[tool.uv.build-backend]
module-name = "mindra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# Кириллица обязательна для строк документации и комментариев проекта.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["mindra"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.importlinter]
root_package = "mindra"

[[tool.importlinter.contracts]]
id = "runtime-layers"
name = "Слои MINDRA через runtime"
type = "layers"
layers = [
    "mindra.entrypoints",
    "mindra.composition",
    "mindra.runtime",
    "mindra.contracts",
]

[[tool.importlinter.contracts]]
id = "reference-layers"
name = "Слои MINDRA через reference"
type = "layers"
layers = [
    "mindra.entrypoints",
    "mindra.composition",
    "mindra.reference",
    "mindra.contracts",
]

[[tool.importlinter.contracts]]
id = "runtime-reference-independence"
name = "Независимость runtime и reference"
type = "independence"
modules = ["mindra.runtime", "mindra.reference"]
